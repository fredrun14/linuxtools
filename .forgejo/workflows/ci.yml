# CI complète — exécutée UNIQUEMENT par Forgejo (GitHub ne lit pas .forgejo/).
# Forgejo est le gardien : lint + type-check + tests + build avec artefacts,
# entièrement en local. GitHub, lui, ne fait que la release sur tag
# (voir .github/workflows/release.yml).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle

      - name: Check PEP8 compliance
        run: pycodestyle src/linuxtools/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          pip install -e ".[dev]"

      - name: Type check (mypy strict)
        run: mypy src/linuxtools/

      - name: Run tests
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # Action d'artefact locale Forgejo (le backend refuse
      # actions/upload-artifact@v4 — « not supported on GHES »).
      - name: Upload artifacts
        uses: forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist/
