# CI complète — exécutée UNIQUEMENT par Forgejo (GitHub ne lit pas .forgejo/).
# Forgejo est le gardien : lint + type-check + tests + build avec artefacts,
# entièrement en local. GitHub, lui, ne fait que la release sur tag
# (voir .github/workflows/release.yml).
name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle

      - name: Check PEP8 compliance
        run: pycodestyle src/linuxtools/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          pip install -e ".[dev]"

      - name: Type check (mypy strict)
        run: mypy src/linuxtools/

      - name: Run tests
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # Action d'artefact locale Forgejo (le backend refuse
      # actions/upload-artifact@v4 — « not supported on GHES »).
      - name: Upload artifacts
        uses: forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Merge automatique — la PR part sur `master` dès que lint/test/build sont
  # verts, sans intervention. Ne tourne QUE sur un événement `pull_request`
  # (symétrique de `promote`, qui ne tourne que sur `push`). Merge immédiat via
  # l'API, pas le planificateur d'auto-merge : grâce à `needs`, les 6 contextes
  # exigés par la protection de branche sont déjà tous `success`. Le contexte de
  # ce job (`CI / automerge (pull_request)`) est encore `pending` au moment du
  # merge — sans conséquence, tant qu'il n'est JAMAIS ajouté à la liste des
  # checks requis (même piège que `promote`).
  automerge:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    # ⚠ Une seule ligne : voir l'avertissement sur le `if:` de `promote`.
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'WIP') }}
    steps:
      - name: Merger la PR sur master
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Garde-fou : si la garde `if:` du job casse (régression YAML), on
          # échoue ici plutôt que de merger sur un événement inattendu.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "automerge hors pull_request : garde if: cassée" >&2
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"Do":"merge","delete_branch_after_merge":true}' \
            "${API}/repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge")
          echo "merge PR #${PR} => HTTP ${code}"
          case "${code}" in
            2*) echo "PR mergée, branche source supprimée." ;;
            *)  echo "Échec du merge (HTTP ${code})" >&2; exit 1 ;;
          esac

  # Promotion — propage vers GitHub le commit/tag qui a passé TOUTE la CI.
  # Ne tourne QUE sur Forgejo (GitHub ne lit pas .forgejo/) et seulement sur
  # un push master ou un tag v* validé. Déclenche la synchro du miroir de
  # push Forgejo→GitHub via l'API : le PAT GitHub vit dans la config du
  # miroir, pas ici — on n'a besoin que d'un jeton Forgejo. Sans ce
  # déclencheur sur tag, un tag poussé sur Forgejo n'atteint jamais GitHub
  # tout seul (le push de tag ne matche pas `on.push.branches`), et
  # .github/workflows/release.yml (déclenché par tag côté GitHub) ne se
  # lance donc jamais.
  promote:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    # ⚠ Une seule ligne, JAMAIS de bloc replié (`if: >`) autour d'un `${{ … }}` :
    # sous forme repliée, l'expression est lue comme une chaîne littérale non
    # vide — donc toujours vraie. Le job tournerait alors sur chaque PR et sa
    # synchro de miroir, concurrente du merge, rembobinerait `master`.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Garde-fou — ne jamais synchroniser le miroir hors d'un push
        run: |
          set -euo pipefail
          # Défense en profondeur : si la garde `if:` recasse, échouer bruyamment
          # ici (PR rouge, merge bloqué) plutôt que corrompre `master` en silence.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "promote exécuté sur '${{ github.event_name }}' : garde if: cassée" >&2
            exit 1
          fi

      - name: Déclencher la synchro du miroir de push vers GitHub
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail
          # github.server_url = URL interne de l'instance, joignable par le runner.
          # GITHUB_REPOSITORY = "fred/linuxtools".
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${API}/repos/${GITHUB_REPOSITORY}/push_mirrors-sync")
          echo "push_mirrors-sync => HTTP ${code}"
          case "${code}" in
            2*) echo "Miroir synchronisé : promotion GitHub déclenchée." ;;
            *)  echo "Échec de la synchro du miroir (HTTP ${code})" >&2; exit 1 ;;
          esac
