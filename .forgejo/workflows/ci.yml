# CI complète — exécutée UNIQUEMENT par Forgejo (GitHub ne lit pas .forgejo/).
# Forgejo est le gardien : lint + type-check + tests + build avec artefacts,
# entièrement en local. GitHub, lui, ne fait que la release sur tag
# (voir .github/workflows/release.yml).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle

      - name: Check PEP8 compliance
        run: pycodestyle src/linuxtools/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          pip install -e ".[dev]"

      - name: Type check (mypy strict)
        run: mypy src/linuxtools/

      - name: Run tests
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # Action d'artefact locale Forgejo (le backend refuse
      # actions/upload-artifact@v4 — « not supported on GHES »).
      - name: Upload artifacts
        uses: forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Promotion — propage vers GitHub le commit qui a passé TOUTE la CI.
  # Ne tourne QUE sur Forgejo (GitHub ne lit pas .forgejo/) et seulement sur
  # un push master validé. Déclenche la synchro du miroir de push Forgejo→GitHub
  # via l'API : le PAT GitHub vit dans la config du miroir, pas ici — on n'a
  # besoin que d'un jeton Forgejo.
  promote:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Déclencher la synchro du miroir de push vers GitHub
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail
          # github.server_url = URL interne de l'instance, joignable par le runner.
          # GITHUB_REPOSITORY = "fred/linuxtools".
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${API}/repos/${GITHUB_REPOSITORY}/push_mirrors-sync")
          echo "push_mirrors-sync => HTTP ${code}"
          case "${code}" in
            2*) echo "Miroir synchronisé : promotion GitHub déclenchée." ;;
            *)  echo "Échec de la synchro du miroir (HTTP ${code})" >&2; exit 1 ;;
          esac
