# CI complète — exécutée UNIQUEMENT par Forgejo (GitHub ne lit pas .forgejo/).
# Forgejo est le gardien : lint + type-check + tests + build avec artefacts,
# entièrement en local. GitHub, lui, ne fait que la release sur tag
# (voir .github/workflows/release.yml).
name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Même motif que le job `test` : [tool.uv.sources] résout webapitools
      # en chemin ../webapitools, il faut le cloner en dépôt frère avant
      # `uv sync`, même si `lint` ne l'importe jamais lui-même.
      - name: Cloner webapitools (dépôt frère)
        run: >-
          git clone --depth 1
          https://git.ricfasohel.fr/fred/webapitools.git ../webapitools

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Synchroniser les dépendances (+ dev)
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/

      - name: Ruff format --check
        run: uv run ruff format --check src/

      - name: Bandit (analyse statique de sécurité)
        run: uv run bandit -ll -r src/linuxtools/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      # [tool.uv.sources] résout webapitools en chemin ../webapitools :
      # il faut un dépôt FRÈRE du répertoire de travail. Clone anonyme
      # en HTTPS : webapitools est public sur ce Forgejo, aucun secret
      # requis. Motif repris tel quel de webapitools/.forgejo/workflows/
      # ci.yml (jobs test/type), qui résout le même besoin en sens
      # inverse (../linuxtools).
      #
      # ⚠ C'est le HEAD de master qui est cloné, pas une version
      # épinglée : une évolution incompatible de webapitools rendra
      # cette CI rouge sans le moindre commit ici — même compromis
      # assumé que côté webapitools.
      - name: Cloner webapitools (dépôt frère)
        run: >-
          git clone --depth 1
          https://git.ricfasohel.fr/fred/webapitools.git ../webapitools

      - name: Install uv (+ Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Synchroniser les dépendances (+ dev)
        run: uv sync --extra dev

      - name: Type check (mypy strict)
        run: uv run mypy src/linuxtools/ tests/

      - name: Run tests
        run: uv run pytest tests/unit/ -v -m "not integration"

  test-integration:
    runs-on: ubuntu-latest
    needs: [test]
    # Advisory tant que tests/integration/ est vide : pytest sort en erreur
    # (exit 5, "no tests collected") sur un dossier vide, ce qui ferait
    # échouer la CI pour rien. Repasser en bloquant (retirer cette ligne)
    # dès qu'un premier vrai test d'intégration existe dans le dossier.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cloner webapitools (dépôt frère)
        run: >-
          git clone --depth 1
          https://git.ricfasohel.fr/fred/webapitools.git ../webapitools

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Synchroniser les dépendances (+ dev)
        run: uv sync --extra dev

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v -m integration

  security:
    runs-on: ubuntu-latest
    # Advisory : dépend du réseau (interroge une base CVE externe), ne doit
    # jamais bloquer un merge sur une indisponibilité tierce. Même pattern
    # que fedora_post_install/.forgejo/workflows/ci.yml (job `security`).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cloner webapitools (dépôt frère)
        run: >-
          git clone --depth 1
          https://git.ricfasohel.fr/fred/webapitools.git ../webapitools

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Synchroniser les dépendances (+ dev)
        run: uv sync --extra dev

      - name: safety check
        run: uv run safety check

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence de py.typed (PEP 561)
        run: test -f src/linuxtools/py.typed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # Action d'artefact locale Forgejo (le backend refuse
      # actions/upload-artifact@v4 — « not supported on GHES »).
      - name: Upload artifacts
        uses: forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Merge automatique — la PR part sur `master` dès que lint/test/build sont
  # verts, sans intervention. Ne tourne QUE sur un événement `pull_request`
  # (symétrique de `promote`, qui ne tourne que sur `push`). Merge immédiat via
  # l'API, pas le planificateur d'auto-merge : grâce à `needs`, les 6 contextes
  # exigés par la protection de branche sont déjà tous `success`. Le contexte de
  # ce job (`CI / automerge (pull_request)`) est encore `pending` au moment du
  # merge — sans conséquence, tant qu'il n'est JAMAIS ajouté à la liste des
  # checks requis (même piège que `promote`).
  automerge:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    # ⚠ Une seule ligne : voir l'avertissement sur le `if:` de `promote`.
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'WIP') }}
    steps:
      - name: Merger la PR sur master
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Garde-fou : si la garde `if:` du job casse (régression YAML), on
          # échoue ici plutôt que de merger sur un événement inattendu.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "automerge hors pull_request : garde if: cassée" >&2
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"Do":"merge","delete_branch_after_merge":true}' \
            "${API}/repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge")
          echo "merge PR #${PR} => HTTP ${code}"
          case "${code}" in
            2*) echo "PR mergée, branche source supprimée." ;;
            *)  echo "Échec du merge (HTTP ${code})" >&2; exit 1 ;;
          esac

  # Promotion — propage vers GitHub le commit/tag qui a passé TOUTE la CI.
  # Ne tourne QUE sur Forgejo (GitHub ne lit pas .forgejo/) et seulement sur
  # un push master ou un tag v* validé. Déclenche la synchro du miroir de
  # push Forgejo→GitHub via l'API : le PAT GitHub vit dans la config du
  # miroir, pas ici — on n'a besoin que d'un jeton Forgejo. Sans ce
  # déclencheur sur tag, un tag poussé sur Forgejo n'atteint jamais GitHub
  # tout seul (le push de tag ne matche pas `on.push.branches`), et
  # .github/workflows/release.yml (déclenché par tag côté GitHub) ne se
  # lance donc jamais.
  promote:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    # ⚠ Une seule ligne, JAMAIS de bloc replié (`if: >`) autour d'un `${{ … }}` :
    # sous forme repliée, l'expression est lue comme une chaîne littérale non
    # vide — donc toujours vraie. Le job tournerait alors sur chaque PR et sa
    # synchro de miroir, concurrente du merge, rembobinerait `master`.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Garde-fou — ne jamais synchroniser le miroir hors d'un push
        run: |
          set -euo pipefail
          # Défense en profondeur : si la garde `if:` recasse, échouer bruyamment
          # ici (PR rouge, merge bloqué) plutôt que corrompre `master` en silence.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "promote exécuté sur '${{ github.event_name }}' : garde if: cassée" >&2
            exit 1
          fi

      - name: Déclencher la synchro du miroir de push vers GitHub
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          API: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail
          # github.server_url = URL interne de l'instance, joignable par le runner.
          # GITHUB_REPOSITORY = "fred/linuxtools".
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${API}/repos/${GITHUB_REPOSITORY}/push_mirrors-sync")
          echo "push_mirrors-sync => HTTP ${code}"
          # Deux authentifications distinctes peuvent échouer ici, et Forgejo
          # les rend par des codes différents — d'où ce diagnostic explicite.
          case "${code}" in
            2*)
              echo "Miroir synchronisé : promotion GitHub déclenchée."
              ;;
            401|403)
              echo "AUTH FORGEJO REFUSÉE (HTTP ${code})." >&2
              echo "Le secret du dépôt FORGEJO_TOKEN est invalide, expiré ou a" >&2
              echo "perdu la portée write:repository. Le régénérer dans" >&2
              echo "Settings > Applications, puis Settings > Actions > Secrets." >&2
              exit 1
              ;;
            404)
              echo "MIROIR INTROUVABLE (HTTP ${code})." >&2
              echo "Aucun miroir de push configuré sur ${GITHUB_REPOSITORY}," >&2
              echo "ou le jeton n'a pas accès au dépôt." >&2
              exit 1
              ;;
            500)
              echo "SYNCHRO FORGEJO -> GITHUB EN ÉCHEC (HTTP ${code})." >&2
              echo "Le jeton Forgejo est valide : c'est le push vers GitHub qui" >&2
              echo "a échoué. Causes par ordre de fréquence :" >&2
              echo "  1. PAT GitHub du miroir expiré ou révoqué -> le renouveler" >&2
              echo "     dans Settings > Mirror Settings (puis retirer le refspec" >&2
              echo "     fetch que l'UI réintroduit)." >&2
              echo "  2. Un commit poussé modifie .github/workflows/ alors que le" >&2
              echo "     PAT n'a pas la permission Workflows." >&2
              echo "  3. Une branche obsolète côté Forgejo casse le refspec." >&2
              echo "Détail exact : docker logs forgejo | grep mirror_push" >&2
              exit 1
              ;;
            *)
              echo "Échec inattendu de la synchro (HTTP ${code})" >&2
              exit 1
              ;;
          esac

      # La réponse 2xx signifie « synchro lancée », pas « GitHub à jour » : on
      # vérifie l'effet réel plutôt que la promesse de l'API (cf. les 405 et 500
      # trompeurs déjà rencontrés sur cette instance).
      - name: Vérifier que GitHub a bien reçu la ref
        env:
          MIRROR_URL: https://github.com/fredrun14/linuxtools.git
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/*) ref="${GITHUB_REF}"; expected="" ;;
            *)           ref='refs/heads/master'; expected="${GITHUB_SHA}" ;;
          esac
          got=""
          for _ in $(seq 1 12); do
            # `|| true` : une erreur réseau transitoire ne doit pas court-circuiter
            # les tentatives restantes (set -e + pipefail sont actifs).
            got=$(git ls-remote "${MIRROR_URL}" "${ref}" 2>/dev/null | cut -f1 || true)
            if [ -n "${got}" ] && { [ -z "${expected}" ] || \
               [ "${got}" = "${expected}" ]; }; then
              echo "GitHub ${ref} = ${got} : promotion confirmée."
              exit 0
            fi
            sleep 5
          done
          echo "GITHUB N'A PAS REÇU LA RÉF ${ref} après 60 s." >&2
          echo "Attendu : ${expected:-<ref présente>} — obtenu : ${got:-<absente>}" >&2
          echo "La synchro a répondu 2xx mais n'a rien propagé : vérifier le" >&2
          echo "miroir (PAT, refspecs) avant de considérer master comme promu." >&2
          exit 1
