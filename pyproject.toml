[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# MÉTADONNÉES DU PROJET — PEP 621
# =============================================================================

[project]
name = "linuxtools"
version = "3.0.0"
description = "Bibliothèque utilitaire Python pour systèmes Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Fred", email = "frederic@ricfasohel.fr"},
]
keywords = [
    "linux", "utils", "systemd", "logging", "configuration",
    "commands", "dotconf", "validation", "integrity", "security",
    "network", "credentials", "identity", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4.12",
]

# =============================================================================
# DÉPENDANCES OPTIONNELLES
# =============================================================================

[project.optional-dependencies]
validation = [
    "pydantic>=2.0",
]
credentials = [
    "python-dotenv>=1.0",
    "keyring>=24.0",
]
deploy = []
network = [
    "webapitools @ git+https://git.ricfasohel.fr/fred/webapitools.git@v0.13.0",
]

# =============================================================================
# OUTILLAGE DE DÉVELOPPEMENT — PEP 735 (jamais publié dans le wheel)
# =============================================================================

# ruff est épinglé `==` : `select = ["ALL"]` suit sa version et `uv.lock` n'est
# pas versionné ; la montée de version se fait dans un commit dédié.
# pydantic, python-dotenv et keyring ne sont pas de l'outillage : ils viennent
# des extras `validation` et `credentials` (`uv sync --all-extras`).
[dependency-groups]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
]
dev = [
    {include-group = "test"},
    "mypy==2.1.0",
    "ruff==0.15.15",
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
]

# =============================================================================
# URLs DU PROJET
# =============================================================================

[project.urls]
# Forgejo est la forge de référence ; GitHub n'est qu'une sauvegarde
# alimentée après CI verte. Ces URLs partent dans le wheel publié :
# elles doivent désigner la forge où les tickets sont réellement suivis.
# Attention, un permalien Forgejo s'écrit /src/branch/<branche>/<chemin>
# et non /blob/<branche>/<chemin> comme chez GitHub.
Homepage      = "https://git.ricfasohel.fr/fred/linuxtools"
Documentation = "https://git.ricfasohel.fr/fred/linuxtools#readme"
Repository    = "https://git.ricfasohel.fr/fred/linuxtools.git"
Issues        = "https://git.ricfasohel.fr/fred/linuxtools/issues"
Changelog     = "https://git.ricfasohel.fr/fred/linuxtools/src/branch/master/CHANGELOG.md"

# =============================================================================
# SOURCE LOCALE — webapitools n'est pas publié sur PyPI (parc homelab)
# =============================================================================

[tool.uv.sources]
webapitools = { path = "../webapitools", editable = true }

# =============================================================================
# CONFIGURATION SETUPTOOLS — src-layout
# =============================================================================

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.toml", "*.yaml", "*.yml", "*.json"]

# =============================================================================
# PYTEST — Configuration des tests
# =============================================================================

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short --strict-markers -ra --cov=src/linuxtools --cov-report=term-missing"
markers = [
    "slow: tests lents, exclure avec '-m \"not slow\"'",
    "integration: tests d'intégration, exclure avec '-m \"not integration\"'",
    "unit: tests unitaires purs",
]

# =============================================================================
# COVERAGE — Couverture de code
# =============================================================================

[tool.coverage.run]
source = ["src/linuxtools"]
branch = true
omit   = [
    "tests/*",
    "*/__pycache__/*",
    "*.pyc",
]

[tool.coverage.report]
fail_under   = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]

# =============================================================================
# MYPY — Vérification statique des types (mode strict)
# =============================================================================

[tool.mypy]
files                   = ["src", "tests"]
python_version          = "3.11"
strict                  = true
warn_return_any         = true
warn_unused_configs     = true
warn_unused_ignores     = true
warn_redundant_casts    = true
disallow_untyped_defs   = true
disallow_any_unimported = true
no_implicit_optional    = true

# `--strict` est un préréglage, pas un maximum. Les réglages ci-dessous n'y
# sont pas inclus et couvrent trois angles morts coûteux :
#   - warn_unreachable    : du code mort issu d'un narrowing faux passait
#     muet. Jamais exécuté, donc jamais testé, il trahit presque toujours
#     un raisonnement faux sur les types.
#   - ignore-without-code : un `# type: ignore` nu taisait une vraie erreur
#     sans laisser de trace (`x: int = "hello"  # type: ignore` rendait
#     *Success*). Il doit désormais nommer ce qu'il tait, ce qui le rend
#     relisible et le périme automatiquement via `warn_unused_ignores`.
#   - redundant-expr      : signale une garde toujours vraie/fausse.
#   - possibly-undefined  : variable potentiellement non liée sur un
#     chemin d'exécution. Couvre notamment les faux positifs mypy de
#     `commands/runner.py` (cf. `# type: ignore[possibly-undefined]`
#     ci-dessous).
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = [
    "keyring.*",
    "dotenv.*",
]
ignore_missing_imports = true

# =============================================================================
# RUFF — Linter moderne (remplace pycodestyle/flake8)
# =============================================================================

[tool.ruff]
line-length    = 88
target-version = "py311"

[tool.ruff.lint]
# Base commune (décision du 2026-10-18) : toutes les règles moins le bruit mesuré.
# ruff est épinglé `==` dans [dependency-groups] : une montée de version, qui peut
# ajouter des règles, se fait dans un commit dédié (ruff check --statistics).
select = ["ALL"]
ignore = [
    # Docstrings facultatives (style Google)
    "D100",    # module
    "D104",    # package (__init__.py)
    "D105",    # méthodes magiques (__repr__...)
    "D106",    # classe imbriquée publique (Meta, Config)
    "D107",    # __init__ : documenté dans la docstring de la classe
    # Conflits avec ruff format
    "COM812",  # virgule finale imposée
    "ISC001",  # concaténation implicite sur une ligne
    # Hors sujet pour ces projets
    "CPY001",  # en-tête de copyright
    "FIX",     # présence de TODO/FIXME : le suivi est dans le vault
    "TD",      # format des TODO
    "PD",      # pandas (faux positifs sur .values hors pandas)
    # Imports déplacés sous TYPE_CHECKING : casse les annotations lues à l'exécution
    "TC001", "TC002", "TC003",
    # Style des messages d'exception : bruit pur
    "TRY003",  # message long passé à l'exception
    "EM101",   # chaîne littérale dans raise
    "EM102",   # f-string dans raise
]
# Typographie française des commentaires et docstrings : pas des caractères ambigus
allowed-confusables = ["–", "—", "’", "«", "»", "\u00a0", "\u202f"]
fixable   = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = [
    # DETTE de l'étape 4/6 « ruff ALL sur src/ » : retirer ce bloc entier.
    "ARG002", "BLE001", "C901", "D205", "D212", "D301", "D412", "D418", "DTZ005",
    "DTZ007", "FURB110", "FURB188", "PERF401",
    "PIE790", "PIE810", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR2004", "PLR5501", "PLW2901", "PTH101", "PTH105", "PTH107", "PTH108",
    "PTH111", "PTH116", "PTH118", "PTH119", "PTH123", "RET504", "RET506", "RUF002",
    "RUF005", "RUF012", "RUF022", "RUF100", "S101", "S103", "S104", "S310", "S314",
    "S603", "SIM102", "SIM103", "SIM105", "SIM108", "SLF001", "T201", "TRY004",
    "TRY300", "TRY301",
]
"tests/**/*.py" = [
    "S101",     # assert
    "S105", "S106", "S108",  # faux secrets, chemins temporaires
    "D",        # docstrings
    "ANN",      # annotations : déjà imposées par mypy --strict (files inclut tests/)
    "PLR2004",  # valeurs attendues en dur
    "SLF001",   # accès aux membres privés du code testé
    "ARG",      # arguments inutilisés (fixtures, faux objets, lambdas de mock)
    "FBT",      # booléens positionnels (mocks, parametrize)
    "INP001",   # tests/ sans __init__.py
    "PLC0415",  # import local dans un test
    "PLR0913",  # nombreuses fixtures
    "N806",     # mocks nommes en majuscules (MockClient)
    "DTZ001",   # datetimes fixes sans fuseau
    "N802",     # noms de tests
]

# =============================================================================
# BANDIT — Analyse statique de sécurité (SAST)
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs"]
skips        = []

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
